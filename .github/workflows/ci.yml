name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Lint & typecheck (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test

  python:
    name: Tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # pyodbc / the Access driver aren't available on Linux CI, so the
      # DB-backed tests skip themselves (pytest.importorskip). The pure
      # calculation characterization tests still run.
      - name: pytest
        run: python -m pytest python/tests -q
